kind: pipeline
type: docker
name: build-and-push

steps:
  - name: build-and-push
    image: plugins/docker
    settings:
      registry:
        from_secret: docker_registry
      repo:
        from_secret: docker_repo
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
      dockerfile: VacaturesApi/Dockerfile
      context: .
      insecure: true

trigger:
  event:
    - push
    - pull_request